<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>直式計算練習</title>
<style>
:root{--ink:#25324a;--line:#526079;--bg:#fffaf3;--card:#fff;--accent:#ffd9e2;--ok:#218739;--bad:#c63d3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:560px;height:100dvh;margin:auto;padding:8px 11px;display:flex;flex-direction:column}
h1{text-align:center;font-size:20px;margin:0 0 7px}
#correction{font-size:15px;color:var(--bad);margin-left:7px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px;touch-action:manipulation}
.mode.active{background:var(--accent);font-weight:700}
.work-area{position:relative;flex:1;min-height:0;margin-top:8px}
.board{height:100%;background:var(--card);border-radius:18px;padding:6px 55px 5px 12px;box-shadow:0 4px 16px #0000000d;display:flex;flex-direction:column}
.hint{text-align:center;font-size:11px;color:#737e90;margin:0}
.sum{width:218px;margin:auto;position:relative}
.row{height:44px;display:grid;grid-template-columns:34px repeat(3,52px);align-items:center;justify-content:center}
/* 刻意保留空隙：上方小框與被加數／被減數十位數不要貼在一起 */
.carry-row{height:31px;margin-bottom:13px}
.op{font-size:31px;text-align:center}
.digit,.answer-cell,.carry-cell{width:44px;height:42px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
.carry-cell{height:29px;font-size:21px;border:2px solid #9ba8ba;border-radius:7px;background:#fff;cursor:pointer}
.crossable{border:2px solid #c6cedb;border-radius:9px;background:#fff;cursor:pointer}
.crossable.crossed::after{content:"";position:absolute;width:54px;height:3px;background:#d55252;transform:rotate(-28deg);border-radius:3px}
.borrow-ten{display:none}
#borrowWrap{
 position:relative;
 width:44px;
 height:42px;
 display:flex;
 align-items:center;
 justify-content:center;
}
#topOnes.borrowed #borrowWrap{
 height:76px;
 margin-top:-34px;
 padding-top:31px;
 border:4px solid #168ca4;
 border-radius:18px;
}
#topOnes.borrowed .borrow-ten{
 display:block;
 position:absolute;
 top:2px;
 left:50%;
 transform:translateX(-50%);
 font-size:20px;
 line-height:1;
 font-weight:700;
 color:#168ca4;
}
.rule{height:3px;background:var(--ink);margin:0 0 3px 34px;width:156px}
.answer-cell{border:2px solid #7d899b;border-radius:8px;margin:0 3px;font-size:29px;background:#fff;cursor:pointer}
.answer-cell.selected,.carry-cell.selected{outline:4px solid #b7d8ff}
.message{text-align:center;min-height:18px;font-size:13px;font-weight:700;margin-top:1px}
#next{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;padding:10px 5px;line-height:1.2;font-size:17px;font-weight:700;background:#f2f2f2}
#next span{display:block}
.keyboard{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin-top:6px}
.key{font-size:21px;padding:9px 2px;min-width:0}
.key.clear{font-size:15px;background:#f3e8ff}
.note{text-align:center;color:#7a8494;font-size:10px;margin-top:2px}

/* 成績畫面 */
.results{display:none;overflow:auto;height:100%;padding:6px 3px 15px}
.results.show{display:block}
.practice.hidden,.modes.hidden{display:none}
.score{text-align:center;font-size:27px;font-weight:800;margin:12px 0 14px}
.result-list{display:grid;gap:7px}
.result-item{display:grid;grid-template-columns:36px 1fr auto;align-items:center;padding:9px 11px;background:#fff;border:1px solid #d7dce4;border-radius:10px;font-size:17px}
.result-item .status{font-weight:800}
.result-item.ok .status{color:var(--ok)}
.result-item.bad .status{color:var(--bad)}
.restart{display:block;width:160px;margin:15px auto 0;background:var(--accent);font-weight:700}

@media(max-height:700px){
 h1{font-size:18px;margin-bottom:4px}
 .app{padding-top:5px}.work-area{margin-top:5px}
 .board{padding-top:3px;padding-bottom:3px}.hint,.note{display:none}
 .row{height:39px}.carry-row{height:27px;margin-bottom:10px}
 .digit,.answer-cell{height:38px;font-size:28px}
 .keyboard{margin-top:4px}.key{padding:7px 2px}
}
</style>
</head>
<body>
<main class="app">
<h1><span id="progress">1/10</span> 直式計算練習 <span id="correction"></span></h1>

<div class="modes" id="modes">
 <button class="mode" data-mode="add">加法</button>
 <button class="mode" data-mode="sub">減法</button>
 <button class="mode active" data-mode="mix">綜合</button>
</div>

<div class="practice" id="practice">
 <div class="work-area">
  <section class="board">
   <div class="hint">點選格子，再用下面的數字鍵盤填寫</div>
   <div class="sum">
    <div class="row carry-row">
     <div></div><div></div><div id="carry" class="carry-cell"></div><div></div>
    </div>
    <div class="row">
     <div></div><div></div><div id="topTens" class="digit crossable"></div><div id="topOnes" class="digit"><span id="borrowWrap"><span class="borrow-ten">10</span><span id="onesValue"></span></span></div>
    </div>
    <div class="row">
     <div id="operator" class="op">＋</div><div></div><div id="bottomTens" class="digit"></div><div id="bottomOnes" class="digit"></div>
    </div>
    <div class="rule"></div>
    <div class="row">
     <div></div>
     <div class="answer-cell" data-pos="2"></div>
     <div class="answer-cell" data-pos="1"></div>
     <div class="answer-cell" data-pos="0"></div>
    </div>
   </div>
   <div id="message" class="message"></div>
  </section>
  <button id="next" aria-label="下一題"><span>下</span><span>一</span><span>題</span></button>
 </div>
 <div class="keyboard" id="keyboard"></div>
 <div class="note">十位數按一下可劃線，再按一次取消。</div>
</div>

<section class="results" id="results">
 <div class="score" id="score"></div>
 <div class="result-list" id="resultList"></div>
 <button class="restart" id="restart">再練 10 題</button>
</section>
</main>

<script>
let mode="mix", current={}, selected=null, questionNo=1, records=[], correcting=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

function newProblem(){
 let op=mode==="mix"?(Math.random()<.5?"add":"sub"):mode,a,b;
 if(op==="add"){a=rand(10,99);b=rand(10,99)}
 else{a=rand(20,99);b=rand(10,a-1)}
 current={a,b,op,answer:op==="add"?a+b:a-b, firstWrong:false};
 correcting=false; render();
}
function render(){
 $("#progress").textContent=questionNo+"/10";
 $("#correction").textContent=correcting?"訂正":"";
 $("#topTens").textContent=Math.floor(current.a/10);
 $("#onesValue").textContent=current.a%10;
 $("#topOnes").classList.remove("borrowed");
 $("#bottomTens").textContent=Math.floor(current.b/10);
 $("#bottomOnes").textContent=current.b%10;
 $("#operator").textContent=current.op==="add"?"＋":"－";
 $("#topTens").classList.remove("crossed");
 $("#carry").textContent="";
 $$(".answer-cell").forEach(x=>x.textContent="");
 $$(".selected").forEach(x=>x.classList.remove("selected"));
 selected=null; $("#message").textContent="";
}
function selectCell(el){
 $$(".selected").forEach(x=>x.classList.remove("selected"));
 selected=el; el.classList.add("selected");
}
$("#carry").onclick=()=>selectCell($("#carry"));
$$(".answer-cell").forEach(el=>el.onclick=()=>selectCell(el));
$("#topTens").onclick=()=>$("#topTens").classList.toggle("crossed");

$$(".mode").forEach(btn=>btn.onclick=()=>{
 mode=btn.dataset.mode;
 $$(".mode").forEach(x=>x.classList.toggle("active",x===btn));
 resetSession();
});

function inputDigit(n){
 if(!selected)return;

 $("#message").textContent="";
 selected.textContent=n;

 // 十位數上方的小框一填入數字，就把個位數視覺化成「10 + 原個位數」。
 // 藍框把上方的 10 與原本個位數一起圈起來。
 if(selected.id==="carry"){
   // 只有減法借位才顯示「10＋個位數」藍框。
   // 加法填上方小框時，不顯示 10，也不顯示藍框。
   if(current.op==="sub"){
     $("#topOnes").classList.add("borrowed");

     // 填完借位後，自動跳到答案個位數。
     const onesAnswer=$('.answer-cell[data-pos="0"]');
     if(onesAnswer) selectCell(onesAnswer);
     return;
   }else{
     $("#topOnes").classList.remove("borrowed");
   }
 }

 if(selected.classList.contains("answer-cell")){
  const p=Number(selected.dataset.pos), next=$(`.answer-cell[data-pos="${p-1}"]`);
  if(next)selectCell(next);
 }
}
function typedAnswer(){
 const cells=$$(".answer-cell");
 const str=cells.map(x=>x.textContent).join("");
 if(str==="") return null;
 return { raw:str, value:Number(str) };
}
const kb=$("#keyboard");
[1,2,3,4,5,6,7,8,9,0].forEach(n=>{
 let b=document.createElement("button");b.className="key";b.textContent=n;b.onclick=()=>inputDigit(n);kb.appendChild(b);
});
let clear=document.createElement("button");
clear.className="key clear";clear.textContent="清除";
clear.onclick=()=>{
 if(selected){
   selected.textContent="";
   if(selected.id==="carry") $("#topOnes").classList.remove("borrowed");
 }else{
   $("#carry").textContent="";
   $("#topOnes").classList.remove("borrowed");
   $$(".answer-cell").forEach(x=>x.textContent="")
 }
};
kb.appendChild(clear);
kb.appendChild(document.createElement("div"));

/* 「下一題」同時負責判斷答案；不另外占一個檢查答案按鈕 */
$("#next").onclick=()=>{
 const ans=typedAnswer();
 if(ans===null){$("#message").style.color="#c63d3d";$("#message").textContent="先填答案喔";return}

 // 送出時才檢查前導 0：
 // 單獨的「0」合法；但 08、05、013 這類寫法不接受。
 if(ans.raw.length>1 && ans.raw.startsWith("0")){
   $("#message").style.color="#c63d3d";
   $("#message").textContent="最前面的數字不用填 0 喔";
   return;
 }

 if(ans.value!==current.answer){
   current.firstWrong=true;
   correcting=true;
   $("#correction").textContent="訂正";
   $("#message").style.color="#c63d3d";
   $("#message").textContent="答錯了，再算一次";
   // 清空答案讓孩子重新訂正，但保留同一題
   $$(".answer-cell").forEach(x=>x.textContent="");
   selected=null; $$(".selected").forEach(x=>x.classList.remove("selected"));
   return;
 }
 // 答對；若曾答錯，該題紀錄仍為錯誤
 records.push({
   no:questionNo,a:current.a,b:current.b,op:current.op,
   answer:current.answer,correct:!current.firstWrong
 });
 if(questionNo>=10){showResults();return}
 questionNo++; newProblem();
};

function showResults(){
 $("#practice").classList.add("hidden");
 $("#modes").classList.add("hidden");
 $("#results").classList.add("show");
 $("#correction").textContent="";
 const correctCount=records.filter(r=>r.correct).length;
 $("#progress").textContent="10/10";
 $("#score").textContent=`分數：${correctCount*10} 分（${correctCount}/10）`;
 $("#resultList").innerHTML=records.map(r=>{
   const sign=r.op==="add"?"＋":"－";
   return `<div class="result-item ${r.correct?"ok":"bad"}">
     <b>${r.no}.</b>
     <span>${r.a} ${sign} ${r.b} ＝ ${r.answer}</span>
     <span class="status">${r.correct?"✓ 正確":"✗ 曾答錯"}</span>
   </div>`;
 }).join("");
}
function resetSession(){
 questionNo=1;records=[];correcting=false;
 $("#practice").classList.remove("hidden");
 $("#modes").classList.remove("hidden");
 $("#results").classList.remove("show");
 newProblem();
}
$("#restart").onclick=resetSession;
newProblem();
</script>
</body>
</html>
