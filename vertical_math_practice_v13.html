<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>直式計算練習</title>
<style>
:root{--ink:#25324a;--line:#526079;--bg:#fffaf3;--card:#fff;--accent:#ffd9e2;--ok:#218739;--bad:#c63d3d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:620px;height:100dvh;margin:auto;padding:8px 11px;display:flex;flex-direction:column}
h1{display:flex;align-items:center;justify-content:center;gap:7px;font-size:25px;margin:0 0 7px}
#correction{font-size:15px;color:var(--bad);margin-left:2px}
.digit-modes{display:inline-flex;gap:5px;margin-left:5px}
.digit-mode{padding:4px 9px;font-size:15px;border-width:2px}
.digit-mode.active{background:var(--accent);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 8px;touch-action:manipulation}
.mode.active{background:var(--accent);font-weight:700}
.work-area{position:relative;flex:1;min-height:0;margin-top:8px}
.board{height:100%;background:var(--card);border-radius:18px;padding:6px 68px 5px 68px;box-shadow:0 4px 16px #0000000d;display:flex;flex-direction:column;overflow:visible}
.hint{text-align:center;font-size:11px;color:#737e90;margin:0}
.sum{width:min(500px,100%);margin:auto;position:relative}
.row{height:70px;display:grid;grid-template-columns:48px repeat(4,86px);align-items:center;justify-content:center}
.carry-row{height:48px;margin-bottom:18px}
.op{font-size:56px;text-align:center}
.digit,.answer-cell,.carry-cell{width:76px;height:64px;display:flex;align-items:center;justify-content:center;font-size:50px;position:relative}
.carry-cell{height:46px;font-size:30px;border:3px solid #9ba8ba;border-radius:11px;background:#fff;cursor:pointer}
.crossable{border:3px solid #c6cedb;border-radius:10px;background:#fff;cursor:pointer}
.crossable.crossed::after{content:"";position:absolute;width:88px;height:4px;background:#d55252;transform:rotate(-28deg);border-radius:3px}
.rule{height:4px;background:var(--ink);margin:0 0 5px 0;width:0}
.answer-cell{border:3px solid #7d899b;border-radius:12px;margin:0 5px;font-size:48px;background:#fff;cursor:pointer}
.answer-cell.selected,.carry-cell.selected{outline:4px solid #b7d8ff}
.message{font-weight:700}
.vertical-message{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:58px;min-height:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.05;color:#c63d3d;z-index:2}
#next{display:block;width:100%;max-width:430px;min-height:0;margin:6px auto 0;padding:9px 12px;font-weight:700;background:#f2f2f2}
.next-vertical{display:flex;align-items:center;justify-content:center}
.next-unit{display:grid;place-items:center;line-height:1}
.next-unit b{display:block;text-align:center;font-size:20px;line-height:24px;font-weight:700}
.next-unit small{display:none}
.keyboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:430px;margin:7px auto 0}
.key{font-size:21px;padding:9px 2px;min-width:0}
.key.clear{font-size:15px;background:#f3e8ff;grid-column:span 2}
.note{text-align:center;color:#7a8494;font-size:10px;margin-top:2px}
.results{display:none;overflow:auto;height:100%;padding:6px 3px 15px}
.results.show{display:block}
.practice.hidden,.modes.hidden,.digit-modes.hidden{display:none}
.score{text-align:center;font-size:27px;font-weight:800;margin:12px 0 14px}
.result-list{display:grid;gap:7px}
.result-item{display:grid;grid-template-columns:36px 1fr auto;align-items:center;padding:9px 11px;background:#fff;border:1px solid #d7dce4;border-radius:10px;font-size:17px}
.result-item .status{font-weight:800}
.result-item.ok .status{color:var(--ok)}
.result-item.bad .status{color:var(--bad)}
.restart{display:block;width:160px;margin:15px auto 0;background:var(--accent);font-weight:700}

@media(max-height:700px){
 h1{font-size:18px;margin-bottom:4px}
 .app{padding-top:5px}.work-area{margin-top:5px}
 .board{padding-top:3px;padding-bottom:3px}.hint,.note{display:none}
 .row{height:61px;grid-template-columns:42px repeat(4,72px)}
 .carry-row{height:41px;margin-bottom:14px}
 .digit,.answer-cell{width:64px;height:56px;font-size:43px}
 .carry-cell{width:64px;height:39px;font-size:27px}
 .op{font-size:49px}
 .rule{margin-left:0;width:0}
 .keyboard{margin-top:4px}.key{padding:6px 2px}
}
@media(max-width:480px){
 .app{width:100%;max-width:none;padding:6px 7px}
 h1{font-size:18px;margin-bottom:5px;gap:3px}
 .digit-modes{gap:3px;margin-left:2px}
 .digit-mode{padding:5px 7px;font-size:14px}
 .modes{gap:5px}.mode{padding:7px 3px}
 .work-area{margin-top:5px}
 .board{position:relative;width:100%;padding:4px 8px;overflow:visible}
 .sum{width:100%;max-width:100%}
 .row{height:61px;grid-template-columns:28px repeat(4,minmax(0,1fr))}
 .carry-row{height:41px;margin-bottom:14px}
 .digit,.answer-cell{width:100%;min-width:0;height:56px;font-size:clamp(25px,8vw,39px);margin:0}
 .carry-cell{width:100%;min-width:0;height:38px;font-size:clamp(22px,7vw,25px)}
 .op{font-size:40px}
 .rule{margin-left:0;width:0;max-width:none}
 .vertical-message{left:2px;width:40px;font-size:15px}
 .keyboard{gap:5px;margin-top:5px}
 .key{padding:7px 2px;font-size:20px}
}
@media(max-width:360px){
 .app{padding-left:5px;padding-right:5px}
 h1{font-size:16px}
 .digit-mode{padding:4px 6px;font-size:13px}
 .board{padding-left:6px;padding-right:6px}
 .row{grid-template-columns:24px repeat(4,minmax(0,1fr));height:57px}
 .carry-row{height:38px;margin-bottom:12px}
 .digit,.answer-cell{width:100%;min-width:0;height:52px;font-size:clamp(23px,7.5vw,35px);margin:0}
 .carry-cell{width:100%;min-width:0;height:35px;font-size:clamp(20px,7vw,23px)}
 .op{font-size:37px}
 .rule{margin-left:0;width:0}
 .vertical-message{width:36px;font-size:14px}
}
</style>
</head>
<body>
<main class="app">
<h1>
  <span id="progress">1/10</span>
  <span>直式計算練習</span>
  <span id="correction"></span>
  <span class="digit-modes" id="digitModes">
    <button class="digit-mode active" data-digits="2">2位</button>
    <button class="digit-mode" data-digits="4">4位</button>
  </span>
</h1>

<div class="modes" id="modes">
 <button class="mode" data-mode="add">加法</button>
 <button class="mode" data-mode="sub">減法</button>
 <button class="mode active" data-mode="mix">綜合</button>
</div>

<div class="practice" id="practice">
 <div class="work-area">
  <section class="board">
   <div class="hint" id="hint">點選格子，再用下面的數字鍵盤填寫</div>
   <div class="sum" id="sum">
    <div class="row carry-row" id="carryRow"></div>
    <div class="row" id="topRow"></div>
    <div class="row" id="bottomRow"></div>
    <div class="rule" id="rule"></div>
    <div class="row" id="answerRow"></div>
   </div>
   <div id="message" class="message vertical-message"></div>
  </section>
 </div>
 <div class="keyboard" id="keyboard"></div>
 <button id="next" aria-label="下一題">下一題</button>
 <div class="note" id="note">被加數/被減數數字按一下可劃線，再按一次取消</div>
</div>

<section class="results" id="results">
 <div class="score" id="score"></div>
 <div class="result-list" id="resultList"></div>
 <button class="restart" id="restart">再練 10 題</button>
</section>
</main>

<script>
const TOTAL_QUESTIONS = 10;
let mode="mix", digitCount=2, current={}, selected=null, questionNo=1, records=[], correcting=false;
let questionOpsQueue = []; // 用於整輪 10 題的運算題型排程

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

// Fisher-Yates 洗牌演算法
function shuffle(array){
  for(let i=array.length-1; i>0; i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// 建立整輪 10 題的運算題型隊列
function buildQuestionQueue(){
  if(mode === "mix"){
    // 嚴格確保 5 題加法與 5 題減法
    const ops = Array(5).fill("add").concat(Array(5).fill("sub"));
    questionOpsQueue = shuffle(ops);
  } else if(mode === "add"){
    questionOpsQueue = Array(TOTAL_QUESTIONS).fill("add");
  } else if(mode === "sub"){
    questionOpsQueue = Array(TOTAL_QUESTIONS).fill("sub");
  }
}

function newProblem(){
  const opIndex = questionNo - 1;
  const op = questionOpsQueue[opIndex] || (Math.random() < 0.5 ? "add" : "sub");

  // 2位數模式：10 ~ 100；4位數模式：1000 ~ 10000
  const min = Math.pow(10, digitCount - 1);
  const max = Math.pow(10, digitCount); // 包含 100 或 10000
  let a, b;
  if(op === "add"){
    a = rand(min, max);
    b = rand(min, max);
  } else {
    a = rand(min, max);
    b = rand(min, a - 1);
  }
  current = {a, b, op, answer: op === "add" ? a + b : a - b, firstWrong: false};
  correcting = false;
  render();
}

function render(){
  $("#progress").textContent = `${questionNo}/${TOTAL_QUESTIONS}`;
  $("#correction").textContent = correcting ? "訂正" : "";

  // 算式欄位依題目中最大的數字位數決定（處理 100 或 10000 的情況）
  const operandCols = Math.max(digitCount, String(current.a).length, String(current.b).length);
  const top = String(current.a).padStart(operandCols, " ");
  const bottom = String(current.b).padStart(operandCols, " ");
  const answerDigits = String(current.answer).length;
  const answerCols = Math.max(operandCols, answerDigits);

  const carryRow=$("#carryRow"), topRow=$("#topRow"), bottomRow=$("#bottomRow"), answerRow=$("#answerRow");
  [carryRow,topRow,bottomRow,answerRow].forEach(r=>r.innerHTML="");

  const makeBlank=()=>document.createElement("div");
  carryRow.appendChild(makeBlank());
  topRow.appendChild(makeBlank());

  const op=document.createElement("div");
  op.className="op";
  op.textContent=current.op==="add"?"＋":"－";
  bottomRow.appendChild(op);

  answerRow.appendChild(makeBlank());

  // 所有列使用相同欄位數，讓個位、十位、百位垂直對齊
  const commonCols = Math.max(operandCols, answerCols);
  const leadingBlanks = commonCols - operandCols;
  for(let i=0; i<leadingBlanks; i++){
    carryRow.appendChild(makeBlank());
    topRow.appendChild(makeBlank());
    bottomRow.appendChild(makeBlank());
  }

  // 由左至右顯示，實際輸入位置仍以個位數為 0
  for(let i=0; i<operandCols; i++){
    const pos = operandCols - 1 - i;

    const carry = document.createElement("div");
    carry.className = "carry-cell";
    carry.dataset.pos = pos;
    carryRow.appendChild(carry);

    const t = document.createElement("div");
    t.className = "digit" + (top[i] !== " " ? " crossable" : "");
    t.textContent = top[i] !== " " ? top[i] : "";
    t.dataset.pos = pos;
    topRow.appendChild(t);

    const b = document.createElement("div");
    b.className = "digit";
    b.textContent = bottom[i] !== " " ? bottom[i] : "";
    bottomRow.appendChild(b);
  }

  // 答案列
  for(let i=0; i<answerCols; i++){
    const ans = document.createElement("div");
    ans.className = "answer-cell";
    ans.dataset.pos = answerCols - 1 - i;
    answerRow.appendChild(ans);
  }

  const setGrid=(row,cols)=>{
    row.style.gridTemplateColumns = window.matchMedia("(max-width: 480px)").matches
      ? `28px repeat(${cols}, minmax(0, 1fr))`
      : `48px repeat(${cols}, 86px)`;
  };
  setGrid(carryRow, commonCols);
  setGrid(topRow, commonCols);
  setGrid(bottomRow, commonCols);

  // 答案列與算式列共用相同欄位座標，個位對個位、十位對十位、百位對百位
  setGrid(answerRow, commonCols);
  answerRow.style.marginLeft = "0";

  // 等式線與置中的算式欄位對齊
  const sumWidth = $("#sum").clientWidth;
  const equationWidth = 48 + operandCols * 86;
  const equationLeft = Math.max(0, (sumWidth - equationWidth) / 2);
  $("#rule").style.width = `${equationWidth}px`;
  $("#rule").style.marginLeft = `${equationLeft}px`;

  $$(".carry-cell").forEach(el=>el.onclick=()=>selectCell(el));
  $$(".answer-cell").forEach(el=>el.onclick=()=>selectCell(el));
  $$(".crossable").forEach(el=>el.onclick=()=>el.classList.toggle("crossed"));

  selected=null;
  $("#message").textContent="";
}

function selectCell(el){
  $$(".selected").forEach(x=>x.classList.remove("selected"));
  selected=el;
  el.classList.add("selected");
}

function inputDigit(n){
  if(!selected) return;
  $("#message").textContent = "";
  selected.textContent = n;

  // 1. 若填寫上方進位/借位格 (carry-cell):
  //    填十位上方 (pos=1) -> 跳轉到答案列個位 (pos=0)
  //    填百位上方 (pos=2) -> 跳轉到答案列十位 (pos=1)
  //    以此類推: pos=k -> 自動跳轉至 answer-cell[data-pos="k-1"]
  if(selected.classList.contains("carry-cell")){
    const p = Number(selected.dataset.pos);
    if(p > 0){
      const targetAns = $(`.answer-cell[data-pos="${p - 1}"]`);
      if(targetAns){
        selectCell(targetAns);
        return;
      }
    }
  }

  // 2. 若填寫答案列格 (answer-cell):
  //    若由高位向低位填寫，依序移往下一低位
  if(selected.classList.contains("answer-cell")){
    const p = Number(selected.dataset.pos);
    const next = $(`.answer-cell[data-pos="${p - 1}"]`);
    if(next) selectCell(next);
  }
}

const kb=$("#keyboard");
[1,2,3,4,5,6,7,8,9,0].forEach(n=>{
  const b=document.createElement("button");
  b.className="key"; b.textContent=n; b.onclick=()=>inputDigit(n);
  kb.appendChild(b);
});
const clear=document.createElement("button");
clear.className="key clear"; clear.textContent="清除";
clear.onclick=()=>{
  if(selected){selected.textContent="";}
  else $$(".answer-cell").forEach(x=>x.textContent="");
};
kb.appendChild(clear);

function typedAnswer(){
  const cells=$$(".answer-cell");
  const str=cells.map(x=>x.textContent).join("");
  if(str==="")return null;
  return {raw:str,value:Number(str)};
}

$("#next").onclick=()=>{
  const ans=typedAnswer();
  if(ans===null){
    $("#message").style.color="#c63d3d";
    $("#message").textContent="先填答案喔";
    return;
  }
  if(ans.raw.length>1 && ans.raw.startsWith("0")){
    $("#message").style.color="#c63d3d";
    $("#message").textContent="最前面的數字不用填 0 喔";
    return;
  }
  if(ans.value!==current.answer){
    current.firstWrong=true;
    correcting=true;
    $("#correction").textContent="訂正";
    $("#message").style.color="#c63d3d";
    $("#message").textContent="答錯了，再算一次";
    $$(".answer-cell").forEach(x=>x.textContent="");
    selected=null;
    $$(".selected").forEach(x=>x.classList.remove("selected"));
    return;
  }

  records.push({no:questionNo,a:current.a,b:current.b,op:current.op,answer:current.answer,correct:!current.firstWrong});
  if(questionNo>=TOTAL_QUESTIONS){showResults();return}
  questionNo++;
  newProblem();
};

$$(".mode").forEach(btn=>btn.onclick=()=>{
  mode=btn.dataset.mode;
  $$(".mode").forEach(x=>x.classList.toggle("active",x===btn));
  resetSession();
});

$$(".digit-mode").forEach(btn=>btn.onclick=()=>{
  digitCount=Number(btn.dataset.digits);
  $$(".digit-mode").forEach(x=>x.classList.toggle("active",x===btn));
  resetSession();
});

function showResults(){
  $("#practice").classList.add("hidden");
  $("#modes").classList.add("hidden");
  $("#digitModes").classList.add("hidden");
  $("#results").classList.add("show");
  $("#correction").textContent="";
  const correctCount=records.filter(r=>r.correct).length;
  $("#progress").textContent=`${TOTAL_QUESTIONS}/${TOTAL_QUESTIONS}`;
  $("#score").textContent=`分數：${correctCount*10} 分（${correctCount}/${TOTAL_QUESTIONS}）`;
  $("#resultList").innerHTML=records.map(r=>{
    const sign=r.op==="add"?"＋":"－";
    return `<div class="result-item ${r.correct?"ok":"bad"}">
      <b>${r.no}.</b>
      <span>${r.a} ${sign} ${r.b} ＝ ${r.answer}</span>
      <span class="status">${r.correct?"✓ 正確":"✗ 曾答錯"}</span>
    </div>`;
  }).join("");
}

function resetSession(){
  questionNo=1;records=[];correcting=false;
  $("#practice").classList.remove("hidden");
  $("#modes").classList.remove("hidden");
  $("#digitModes").classList.remove("hidden");
  $("#results").classList.remove("show");
  buildQuestionQueue();
  newProblem();
}

$("#restart").onclick=resetSession;

// 頁面初次載入執行
buildQuestionQueue();
newProblem();
</script>
</body>
</html>
